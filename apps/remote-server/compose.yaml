name: bigdog-remote
services:
  remote:
    build:
      context: ../..
      dockerfile: apps/remote-server/Dockerfile
    restart: unless-stopped
    environment:
      DSH_SERVER_ACCOUNT: ${REMOTE_ACCOUNT:?Set REMOTE_ACCOUNT}
      DSH_SERVER_PASSWORD: ${REMOTE_PASSWORD:?Set REMOTE_PASSWORD}
      DSH_SERVER_PUBLIC_URL: ${REMOTE_PUBLIC_URL:?Set REMOTE_PUBLIC_URL}
      DSH_SERVER_TURN_URLS: ${TURN_URLS:-}
      DSH_SERVER_TURN_SECRET: ${TURN_SHARED_SECRET:-}
      BIGDOG_PUSH_ORIGIN: ${PUSH_ORIGIN:-}
    volumes:
      - remote-data:/data
    ports:
      - '127.0.0.1:48300:8080'
  https:
    image: caddy:2.10
    profiles: [public]
    restart: unless-stopped
    environment:
      REMOTE_DOMAIN: ${REMOTE_DOMAIN:-localhost}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [remote]
  turn:
    image: coturn/coturn:4.6.3
    profiles: [public]
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --realm=${REMOTE_DOMAIN:-localhost}
      - --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}
      - --min-port=25060
      - --max-port=25100
      - --no-multicast-peers
      - --no-loopback-peers
      - --log-file=stdout
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '25060-25100:25060-25100/udp'
volumes:
  remote-data:
  caddy-data:
